name: slow-and-steady-ai
services:
  ollama:
    image: ollama/ollama:0.6.2
    container_name: slow-steady-ollama
    volumes:
      - ollama_data:/root/.ollama
    expose:
      - "11434"
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  lazymate:
    build: ./lazymate
    container_name: slow-steady-lazymate
    environment:
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:3b}
      MAX_TEXT_CHARS: 30000
      RATE_LIMIT_REQUESTS: 30
      RATE_LIMIT_WINDOW_SECONDS: 60
      WORKSPACE_ROOT: /workspace
    volumes:
      - ./lazymate/workspace:/workspace
    depends_on:
      - ollama
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    restart: unless-stopped

  sellermate-web:
    build: ./sellermate/app
    container_name: slow-steady-sellermate-web
    depends_on:
      - sellermate-ai
    restart: unless-stopped

  sellermate-ai:
    build: ./sellermate/ai_service
    container_name: slow-steady-sellermate-ai
    environment:
      OLLAMA_URL: http://ollama:11434
      MODEL_NAME: ${OLLAMA_MODEL:-qwen2.5:3b}
      ALLOWED_ORIGINS: http://localhost:8080,http://127.0.0.1:8080
    depends_on:
      - ollama
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  gateway:
    image: nginx:1.27-alpine
    container_name: slow-steady-gateway
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./gateway/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - lazymate
      - sellermate-web
      - sellermate-ai
    restart: unless-stopped

volumes:
  ollama_data:
